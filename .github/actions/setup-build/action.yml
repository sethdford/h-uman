name: Setup and Build Human
description: Install dependencies, configure, and build Human

inputs:
  build-type:
    description: CMake build type (Debug, MinSizeRel)
    default: Debug
  build-dir:
    description: Build directory name
    default: build
  enable-asan:
    description: Enable AddressSanitizer
    default: "false"
  enable-curl:
    description: Enable libcurl HTTP client
    default: "false"
  enable-all-channels:
    description: Enable all channel implementations
    default: "false"
  enable-lto:
    description: Enable link-time optimization
    default: "false"
  enable-coverage:
    description: Enable gcov coverage instrumentation
    default: "false"
  enable-fuzz:
    description: Enable fuzzing builds (requires clang)
    default: "false"
  extra-apt:
    description: Additional apt packages to install
    default: ""
  target:
    description: CMake build target (empty for all)
    default: ""
  enable-update:
    description: Enable self-update support
    default: "false"
  extra-cmake-flags:
    description: Additional CMake flags
    default: ""

runs:
  using: composite
  steps:
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Phase 5 self-healing: apt mirror flakes (transient 5xx / DNS / lock
        # contention on the shared runner) are a recurring CI-red cause that has
        # nothing to do with the change under test. Wrap the two network steps in
        # a bounded retry that fails LOUDLY after 3 attempts (so a genuinely
        # broken install still goes red) but rides out a single transient blip.
        # `until <cmd>` is exempt from `set -eo pipefail`, so the final failure
        # propagates via the explicit `exit 1` rather than being swallowed.
        retry() {
          n=0
          until "$@"; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::transient install failed after 3 attempts: $*"
              exit 1
            fi
            echo "::warning::attempt ${n}/3 failed: $* — retrying in $((n * 5))s"
            sleep "$((n * 5))"
          done
        }
        retry sudo apt-get update
        # libsodium-dev: required by src/persona/persona_crypt.c — main
        # commit 6af7ad34 (US-8.2 persona encryption-at-rest) made the
        # crypto layer #error at compile time when libsodium isn't
        # available. Without this package, every CI build that touches
        # human_core fails with `sodium.h: No such file or directory`.
        PKGS="libsqlite3-dev libsodium-dev ccache"
        if [ "${{ inputs.enable-curl }}" = "true" ]; then PKGS="$PKGS libcurl4-openssl-dev"; fi
        if [ -n "${{ inputs.extra-apt }}" ]; then PKGS="$PKGS ${{ inputs.extra-apt }}"; fi
        # shellcheck disable=SC2086 # intentional word-split of the package list
        retry sudo apt-get install -y $PKGS

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      # libsodium: same reason as Linux — persona_crypt.c hard-requires it.
      # Same Phase 5 transient-retry rationale as the Linux step: brew bottle
      # downloads occasionally 5xx on the shared cache; retry, fail loud at 3.
      run: |
        retry() {
          n=0
          until "$@"; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::transient install failed after 3 attempts: $*"
              exit 1
            fi
            echo "::warning::attempt ${n}/3 failed: $* — retrying in $((n * 10))s"
            sleep "$((n * 10))"
          done
        }
        retry brew install sqlite3 libsodium ccache

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache
        # cache version bumped to -v2- (2026-05-29): the prefix restore-keys
        # had been restoring a concurrent branch's ccache, serving stale objects
        # for changed sources (phantom symbols / dpo.h errors in variant builds).
        # v2 evicts the poisoned caches; content-addressed reuse resumes after.
        key: ${{ runner.os }}-ccache-v2-${{ hashFiles('src/**', 'include/**') }}
        restore-keys: |
          ${{ runner.os }}-ccache-v2-

    - name: Configure ccache
      shell: bash
      run: |
        ccache --set-config=max_size=500M
        ccache --zero-stats

    - name: Configure
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "macOS" ]; then
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        fi
        mkdir -p ${{ inputs.build-dir }} && cd ${{ inputs.build-dir }}
        rm -f CMakeCache.txt
        CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=${{ inputs.build-type }} -DCMAKE_C_COMPILER_LAUNCHER=ccache"
        if [ "${{ inputs.enable-asan }}" = "true" ]; then CMAKE_FLAGS="$CMAKE_FLAGS -DHU_ENABLE_ASAN=ON"; fi
        if [ "${{ inputs.enable-curl }}" = "true" ]; then CMAKE_FLAGS="$CMAKE_FLAGS -DHU_ENABLE_CURL=ON"; fi
        if [ "${{ inputs.enable-all-channels }}" = "true" ]; then CMAKE_FLAGS="$CMAKE_FLAGS -DHU_ENABLE_ALL_CHANNELS=ON"; fi
        if [ "${{ inputs.enable-lto }}" = "true" ]; then CMAKE_FLAGS="$CMAKE_FLAGS -DHU_ENABLE_LTO=ON"; fi
        if [ "${{ inputs.enable-fuzz }}" = "true" ]; then CMAKE_FLAGS="$CMAKE_FLAGS -DHU_ENABLE_FUZZ=ON"; fi
        if [ "${{ inputs.enable-update }}" = "true" ]; then CMAKE_FLAGS="$CMAKE_FLAGS -DHU_ENABLE_UPDATE=ON"; fi
        if [ "${{ inputs.enable-coverage }}" = "true" ]; then
          CMAKE_FLAGS="$CMAKE_FLAGS -DCMAKE_C_FLAGS=--coverage"
        fi
        if [ -n "${{ inputs.extra-cmake-flags }}" ]; then CMAKE_FLAGS="$CMAKE_FLAGS ${{ inputs.extra-cmake-flags }}"; fi
        cmake .. $CMAKE_FLAGS

    - name: Build
      shell: bash
      run: |
        TARGET_FLAG=""
        if [ -n "${{ inputs.target }}" ]; then TARGET_FLAG="--target ${{ inputs.target }}"; fi
        cmake --build ${{ inputs.build-dir }} $TARGET_FLAG -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

    - name: ccache stats
      shell: bash
      run: ccache --show-stats
