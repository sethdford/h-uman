name: W16 Evaluation Suite

# Continuous benchmark coverage for the v2 memory roadmap (W16).
#
# Runs the six `human evaluation` backends nightly and on demand, captures
# per-suite JSON reports as artifacts, and gates regression against
# docs/evaluation/baseline.json. The schedule deliberately sits outside the
# main `eval.yml` workflow so a flaky benchmark never blocks PR CI.
#
# Spec: docs/plans/2026-05-10-w16-evaluation-suite.md

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      write_baseline:
        description: "Update docs/evaluation/baseline.json with this run's scores"
        type: boolean
        default: false
      frontier_live:
        description: "Run frontier-compare with live API calls (requires secrets)"
        type: boolean
        default: false

jobs:
  bench:
    name: Run W16 evaluation bench
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HU_EVAL_THRESHOLD_LOCOMO: "5"
      HU_EVAL_THRESHOLD_LONGMEMEVAL: "10"
      HU_EVAL_THRESHOLD_MEMORYAGENTBENCH: "5"
      HU_EVAL_THRESHOLD_TURING: "8"
      HU_EVAL_THRESHOLD_FRONTIER: "15"
      HU_EVAL_THRESHOLD_HUMANNESS: "10"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          build-type: Debug
          enable-curl: "true"

      - name: Fetch evaluation datasets
        run: scripts/fetch-evaluation-datasets.sh || true

      - name: Sanity check the binary built
        run: ./build/human evaluation list

      - name: Bench against committed baseline
        id: bench
        run: |
          set -o pipefail
          mkdir -p build/evaluation-reports
          BASELINE_ARG=""
          if [ -f docs/evaluation/baseline.json ]; then
            BASELINE_ARG="--baseline docs/evaluation/baseline.json"
          fi
          # --skip-unavailable: CI has no LLM provider configured, so the
          # `frontier` suite (which needs a real provider/API key) would
          # otherwise error and fail the whole bench. Skip suites whose
          # backend is unavailable; the regression gate still covers every
          # suite that runs offline.
          ./build/human evaluation bench $BASELINE_ARG \
              --write-baseline build/evaluation-reports/fresh_baseline.json \
              --fail-on-regression \
              --skip-unavailable \
              | tee build/evaluation-reports/bench.json

      - name: Verify per-suite regression thresholds
        if: always() && steps.bench.outcome == 'success'
        run: |
          set -e
          REPORT="build/evaluation-reports/bench.json"
          if [ ! -f "$REPORT" ]; then
            echo "No bench report — skipping per-suite threshold check"
            exit 0
          fi
          echo "Per-suite regression thresholds (max percent drop):"
          echo "  LoCoMo:           ${HU_EVAL_THRESHOLD_LOCOMO}%"
          echo "  LongMemEval:      ${HU_EVAL_THRESHOLD_LONGMEMEVAL}%"
          echo "  MemoryAgentBench: ${HU_EVAL_THRESHOLD_MEMORYAGENTBENCH}%"
          echo "  Turing:           ${HU_EVAL_THRESHOLD_TURING}%"
          echo "  Frontier:         ${HU_EVAL_THRESHOLD_FRONTIER}%"
          echo "  Humanness:        ${HU_EVAL_THRESHOLD_HUMANNESS}%"
          echo ""
          echo "Regression gate passed (--fail-on-regression enforces thresholds)."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w16-evaluation-reports
          path: build/evaluation-reports/

      - name: Open baseline-update PR
        if: |
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.write_baseline == 'true'
          && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p docs/evaluation
          cp build/evaluation-reports/fresh_baseline.json docs/evaluation/baseline.json
          BRANCH="evaluation/baseline-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/evaluation/baseline.json
          git commit -m "chore(evaluation): refresh W16 baseline ($(date -u +%Y-%m-%d))"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(evaluation): refresh W16 baseline" \
            --body "Automated baseline refresh from W16 evaluation workflow." \
            --base main --head "$BRANCH"

  unit-tests:
    name: W16 evaluation unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          build-type: Debug
          enable-curl: "true"

      - name: Run W16 evaluation unit tests
        run: ./build/human_tests --suite="W16 evaluation"

  frontier-live:
    name: Frontier-compare (live, gated)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.frontier_live == 'true'
    permissions:
      contents: read
    env:
      HU_W16_FRONTIER_LIVE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          build-type: Debug
          enable-curl: "true"

      - name: Fetch evaluation datasets
        run: scripts/fetch-evaluation-datasets.sh || true

      - name: Run frontier-compare with live providers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_ADC_JSON: ${{ secrets.GCP_ADC_JSON }}
        run: ./build/human evaluation run frontier

  # Tier-1 blind-A/B proxy gate (LLM-judge). A REAL measurement needs both
  # Gemini creds AND a model-serving endpoint (HU_GATEWAY_URL); a bare runner
  # has neither, so this falls back to the ADVISORY dry-run that validates the
  # gate plumbing without faking a measurement. When a serving path exists,
  # set HU_GATEWAY_URL + GEMINI_API_KEY and the real proxy run takes over and
  # updates docs/evaluation/blind_ab_gate.json. The authoritative human tier
  # (scripts/blind_ab/) remains the veto — see docs/evaluation/REAL_PAIRS_FOLLOWUP.md.
  blind-ab-gate:
    name: Blind-A/B proxy gate (LLM-judge)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run blind-A/B proxy gate (real if serving available, else ADVISORY dry-run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HU_GATEWAY_URL: ${{ secrets.HU_GATEWAY_URL }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$HU_GATEWAY_URL" ]; then
            echo "Creds + serving present — running live proxy gate"
            python3 scripts/eval_blinded_ab.py --gate --gateway
          else
            echo "No creds/serving — ADVISORY dry-run (validates wiring, does not measure)"
            python3 scripts/eval_blinded_ab.py --gate --gate-dry-run
          fi
      - name: Show gate verdict
        run: |
          python3 -c "import json; d=json.load(open('docs/evaluation/blind_ab_gate.json')); print('effective_verdict=', d['effective_verdict'], 'proxy.mode=', d['proxy']['mode'])"
      # Evidence-recency gate: CI can never run the REAL measurement (the model
      # serves on local hardware), so instead of letting the ADVISORY dry-run
      # pass green forever, fail loudly when the COMMITTED verdict artifact has
      # no real (non-ADVISORY proxy, or scored human) measurement within 14
      # days. The runner-local dry-run write above does not count: it stamps
      # mode=ADVISORY and is never committed. Checked against the checkout, so
      # this audits what the repo claims, not what this job just wrote.
      - name: Measurement freshness gate (fails when evidence is stale)
        run: |
          git checkout -- docs/evaluation/blind_ab_gate.json
          python3 scripts/check_measurement_freshness.py --max-age-days 14
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blind-ab-gate
          path: docs/evaluation/blind_ab_gate.json
