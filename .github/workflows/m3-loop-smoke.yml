name: M3 Closed-Loop Smoke

# Live-fires the dormant LoRA loop end-to-end on every push touching the
# loop's surface — the producer hook (agent.c), the gateway endpoint
# (gateway.c), the driver (scripts/m3_outcome_driver.py), and the
# orchestration script itself. Catches regressions in any of the four
# code boundaries the loop crosses.
#
# Security: this workflow uses ONLY trusted GitHub contexts (runner.os,
# matrix.os). No issue/PR/commit message values are interpolated into
# run: blocks, so command injection per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
# is not reachable here.

on:
  push:
    paths:
      - "src/agent/agent.c"
      - "src/gateway/gateway.c"
      - "src/ml/m3_frontier_adapter.c"
      - "include/human/ml/m3_frontier_adapter.h"
      - "scripts/m3_outcome_driver.py"
      - "scripts/stub_mlx_server.py"
      - "scripts/live_fire_m3_loop.sh"
      - "scripts/test_m3_outcome_driver.py"
      - "scripts/training_loop.py"
      - "scripts/test_m3_train_from_outcomes.py"
      - "scripts/m3_status.py"
      - "scripts/m3_dpo_from_rewrites.py"
      - "scripts/test_m3_dpo_from_rewrites.py"
      - "scripts/m3_eval_adapter.py"
      - "scripts/test_m3_eval_adapter.py"
      - "include/human/ml/m3_rewrite_capture.h"
      - "src/ml/m3_rewrite_capture.c"
      - "scripts/m3_mlx_lora_bridge.py"
      - "scripts/test_m3_mlx_lora_bridge.py"
      - "scripts/m3_drift_detector.py"
      - "scripts/test_m3_drift_detector.py"
      - "scripts/m3_contact_routing.py"
      - "scripts/test_m3_contact_routing.py"
      - "scripts/m3_promote.py"
      - "scripts/test_m3_promote.py"
      - "scripts/live_fire_m3_canary.sh"
      - "scripts/test_m3_canary.py"
      - "scripts/m3_loop_cycle.sh"
      - "include/human/ml/m3_contact_routes.h"
      - "src/ml/m3_contact_routes.c"
      - "scripts/m3_extract_corpus.py"
      - "scripts/test_m3_extract_corpus.py"
      - "scripts/m3_generate_counterfactuals.py"
      - "scripts/test_m3_generate_counterfactuals.py"
      - "scripts/m3_active_probe.py"
      - "scripts/test_m3_active_probe.py"
      - "scripts/m3_probe_collector.py"
      - "scripts/test_m3_probe_collector.py"
      - "scripts/m3_h_tier_demo.sh"
      - "Makefile"
      - "CMakePresets.json"
      - ".github/workflows/m3-loop-smoke.yml"
  pull_request:
    paths:
      - "src/agent/agent.c"
      - "src/gateway/gateway.c"
      - "src/ml/m3_frontier_adapter.c"
      - "include/human/ml/m3_frontier_adapter.h"
      - "scripts/m3_outcome_driver.py"
      - "scripts/stub_mlx_server.py"
      - "scripts/live_fire_m3_loop.sh"
      - "scripts/test_m3_outcome_driver.py"
      - "scripts/training_loop.py"
      - "scripts/test_m3_train_from_outcomes.py"
      - "scripts/m3_status.py"
      - "scripts/m3_dpo_from_rewrites.py"
      - "scripts/test_m3_dpo_from_rewrites.py"
      - "scripts/m3_eval_adapter.py"
      - "scripts/test_m3_eval_adapter.py"
      - "include/human/ml/m3_rewrite_capture.h"
      - "src/ml/m3_rewrite_capture.c"
      - "scripts/m3_mlx_lora_bridge.py"
      - "scripts/test_m3_mlx_lora_bridge.py"
      - "scripts/m3_drift_detector.py"
      - "scripts/test_m3_drift_detector.py"
      - "scripts/m3_contact_routing.py"
      - "scripts/test_m3_contact_routing.py"
      - "scripts/m3_promote.py"
      - "scripts/test_m3_promote.py"
      - "scripts/live_fire_m3_canary.sh"
      - "scripts/test_m3_canary.py"
      - "scripts/m3_loop_cycle.sh"
      - "include/human/ml/m3_contact_routes.h"
      - "src/ml/m3_contact_routes.c"
      - "scripts/m3_extract_corpus.py"
      - "scripts/test_m3_extract_corpus.py"
      - "scripts/m3_generate_counterfactuals.py"
      - "scripts/test_m3_generate_counterfactuals.py"
      - "scripts/m3_active_probe.py"
      - "scripts/test_m3_active_probe.py"
      - "scripts/m3_probe_collector.py"
      - "scripts/test_m3_probe_collector.py"
      - "scripts/m3_h_tier_demo.sh"
  workflow_dispatch:

jobs:
  driver-e2e:
    name: Driver e2e (self-contained, no daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run driver e2e tests (fake gateway + fake MLX in-process)
        run: python3 scripts/test_m3_outcome_driver.py

      - name: Run train-from-outcomes (C3) verifier
        # 25 assertions covering FNV-1a cross-language agreement,
        # JSONL parse tolerance, summary aggregates, DB hash resolution,
        # and the dry-run safetensors artifact format.
        run: python3 scripts/test_m3_train_from_outcomes.py

      - name: Run adapter A/B eval (C5) verifier
        # 14 assertions covering all four verdict paths through
        # MetadataJudge (pass / no-change / fail / regress) plus
        # format-inspection contracts for lora-bin and safetensors.
        run: python3 scripts/test_m3_eval_adapter.py

      - name: Run DPO-from-rewrites (D7) consumer verifier
        # 13 assertions covering parse filtering, summary aggregates,
        # Alpaca-DPO export schema (accepted→chosen mapping), and empty-
        # input handling. Cross-checks that the C-side rewrite-capture
        # output is consumable.
        run: python3 scripts/test_m3_dpo_from_rewrites.py

      - name: Run MLX-lm.lora bridge (E2) verifier
        # 16 assertions covering format detection, mlx-lm format
        # conversion, stub-adapter when mlx_lm unavailable, gemma
        # chat-template wrapping.
        run: python3 scripts/test_m3_mlx_lora_bridge.py

      - name: Run drift detector (E4) verifier
        # 16 assertions covering all status verdicts (OK / DEGRADING /
        # NEEDS_ROLLBACK), threshold tuning, and window bucketing.
        run: python3 scripts/test_m3_drift_detector.py

      - name: Run contact-routing (E5) verifier
        # 12 assertions covering load/save atomicity, lookup precedence,
        # and the promote/demote roundtrip.
        run: python3 scripts/test_m3_contact_routing.py

      - name: Run promote CLI (G2) verifier
        # 17 assertions covering swap + rollback against a fake MLX,
        # lineage manifest writes, and production-path guard.
        run: python3 scripts/test_m3_promote.py

      - name: Run canary live-fire (G3) verifier
        # 9 assertions covering the canary's full lifecycle including
        # automatic rollback via shell trap on EXIT.
        run: python3 scripts/test_m3_canary.py

      - name: Run corpus extractor (H1) verifier
        # 29 assertions covering PII redaction, hash determinism, Apple
        # epoch conversion, iMessage + memory.db schema reads, and the
        # end-to-end JSONL output shape with fixture DBs.
        run: python3 scripts/test_m3_extract_corpus.py

      - name: Run counterfactual generator (H2) verifier
        # 18 assertions covering synthetic variant count/distinctness,
        # style-violation injection, same-contact pairing (no cross-
        # conversation bleed), and end-to-end --no-llm output.
        run: python3 scripts/test_m3_generate_counterfactuals.py

      - name: Run active probe (H3) verifier
        # 60 assertions covering response→pairs parsing (letter, freetext,
        # empty), probe formatting + sentinel header, deliver_probe modes
        # (simulate/queue), eligible-message picking, message-aware
        # synthetic candidates, gateway parse + TimeoutError/URLError/
        # OSError soft-fail, and end-to-end --simulate flows.
        run: python3 scripts/test_m3_active_probe.py

      - name: Run probe collector (H3b) verifier
        # 40 assertions covering queue load/save atomicity, malformed-line
        # tolerance, find_next_pending, simulate-tick all paths (letter,
        # freetext, no-response, no-pending, malformed), dispatch + poll
        # stub contracts, and the H3 → collector → pairs end-to-end flow.
        run: python3 scripts/test_m3_probe_collector.py

      - name: Run H-tier full end-to-end demo (fixture mode)
        # Runs H1 → H2 → H3 → H3b → merge with fixture DBs (no FDA
        # needed). Verifies the chain produces a combined Alpaca-DPO
        # file ready for dpo-train. This is the integration test that
        # the unit verifiers alone cannot prove.
        run: bash scripts/m3_h_tier_demo.sh --fixture

  live-fire:
    name: Full live-fire (release binary + stub MLX + real daemon)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libsqlite3-dev libsodium-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install cmake libsodium || true

      - name: Build release binary
        run: |
          cmake --preset release
          cmake --build --preset release --target human -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Sanity-check the binary
        run: |
          ls -la build-release/human
          ./build-release/human --version || true

      - name: Run the live-fire orchestration
        run: bash scripts/live_fire_m3_loop.sh
        env:
          HUMAN_M3_ADAPTER_DISABLE: ""

      - name: Upload evidence log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: m3-live-fire-logs-${{ matrix.os }}
          path: |
            /tmp/live-fire-run.log
            /tmp/human-gateway-live.log
            /tmp/stub-mlx.log
            /tmp/driver-output.log
            /tmp/chat-resp-*.json
          retention-days: 7
