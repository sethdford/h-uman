name: ratchet-debt

# The architecture ratchets in .githooks/pre-commit fail only on GROWTH, so they
# freeze the level and never lower it. This job supplies the pressure, off the
# critical path: it never blocks a commit, a PR, or the merge queue. It reports
# into ONE durable issue so missed targets accumulate visibly instead of
# scrolling past in a CI log.
#
# Deliberately not a required check (.claude/rules/ci-required-checks.md): a
# calendar-driven failure must never block a change that touched nothing
# relevant — session-worktree-isolation.md records that such a gate "would have
# blocked the same day's three urgent red-CI fixes".

on:
  schedule:
    - cron: '43 13 * * 1'   # Mondays 13:43 UTC — off the :00 rush
  workflow_dispatch:
    inputs:
      aggression:
        description: 'Fraction of proven velocity to ask for (default 0.5)'
        required: false
        default: '0.5'

permissions:
  contents: read
  issues: write

concurrency:
  group: ratchet-debt
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the adaptive rate is fitted from baseline history

      - name: Measure ratchet debt
        id: debt
        env:
          RATCHET_AGGRESSION: ${{ github.event.inputs.aggression || '0.5' }}
          RATCHET_JSON_OUT: ratchet-debt.json
        run: |
          set +e
          bash scripts/ratchet-debt-report.sh | tee report.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ratchet-debt
          path: |
            report.txt
            ratchet-debt.json
          if-no-files-found: warn

      # exit 2 == a counter could not be measured. That is a broken report, not
      # debt; claiming debt from an unmeasured counter is the exact failure
      # .claude/rules/no-number-without-a-measurement.md forbids.
      - name: Fail loudly on an unmeasurable counter
        if: steps.debt.outputs.rc == '2'
        run: |
          echo "::error::ratchet-debt could not measure a counter; no debt claimed."
          cat report.txt
          exit 1

      - name: Open or update the debt issue
        if: steps.debt.outputs.rc == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const title = 'Ratchet debt: counters above their decay target';
            const body = [
              'The architecture ratchets fail only on growth, so this job checks the',
              'other direction: is each counter still *moving down*?',
              '',
              'Targets are not hand-picked. Each is derived from that counter\'s own',
              'baseline history — the median of its observed per-drop rates, taken at',
              '`RATCHET_AGGRESSION` (default 0.5) — so a target only ever asks for half',
              'of what this repo has already demonstrated on that specific counter.',
              'Pressure accrues from how long the baseline has sat still, not from a',
              'fixed calendar, and any single ask is capped at 5% of the baseline.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              'Two valid responses:',
              '- Pay some down. Auto-lock in `scripts/lib/ratchet.sh` captures the gain',
              '  the moment a gate next runs — no manual baseline edit needed.',
              '- Decide the target is wrong and say why in `scripts/ratchet-config.tsv`',
              '  (set `rate=off`, or raise the `floor`). Recording the reason is the point;',
              '  a target nobody agrees with should be changed, not ignored.',
              '',
              `_Updated ${new Date().toISOString().slice(0, 10)} by the \`ratchet-debt\` workflow._`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ratchet-debt', per_page: 10,
            });
            const hit = existing.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              });
              core.notice(`Updated #${hit.number}`);
            } else {
              const made = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ratchet-debt'],
              });
              core.notice(`Opened #${made.data.number}`);
            }

      # Close the issue when everything is back on target, so an open issue
      # always means live debt rather than stale history.
      - name: Close the debt issue when clear
        if: steps.debt.outputs.rc == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Ratchet debt: counters above their decay target';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ratchet-debt', per_page: 10,
            });
            for (const i of open.data.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: 'All configured counters are at or below target. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }
