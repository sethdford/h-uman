name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-latest
            target: linux-aarch64
            cross: true
          - os: macos-latest
            target: macos-aarch64

    steps:
      - uses: actions/checkout@v7

      - name: Install aarch64 cross-compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libsqlite3-dev:arm64 libcurl4-openssl-dev:arm64
        continue-on-error: true

      - uses: ./.github/actions/setup-build
        with:
          build-type: MinSizeRel
          enable-lto: "true"
          enable-curl: ${{ !matrix.cross && 'true' || 'false' }}
          enable-all-channels: "true"
          enable-update: "true"
          target: human
          extra-cmake-flags: ${{ matrix.cross && '-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: human-${{ matrix.target }}
          path: build/human

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            completions
            docs/man
            install.sh
            LICENSE

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          ls -R artifacts/
          mv artifacts/human-linux-x86_64/human human-linux-x86_64.bin
          mv artifacts/human-linux-aarch64/human human-linux-aarch64.bin
          mv artifacts/human-macos-aarch64/human human-macos-aarch64.bin
          chmod +x human-linux-x86_64.bin human-linux-aarch64.bin human-macos-aarch64.bin

      - name: Generate SHA256 checksums
        run: sha256sum human-linux-x86_64.bin human-linux-aarch64.bin human-macos-aarch64.bin > sha256sums.txt

      - name: Package completions and man pages
        run: tar czf human-extras.tar.gz completions/ docs/man/ install.sh LICENSE

      - name: Build .deb package (x86_64)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG=human_${VER}_amd64
          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/bin"
          mkdir -p "${PKG}/usr/share/man/man1"
          mkdir -p "${PKG}/usr/share/bash-completion/completions"
          mkdir -p "${PKG}/usr/share/zsh/vendor-completions"
          cp human-linux-x86_64.bin "${PKG}/usr/bin/human"
          chmod 755 "${PKG}/usr/bin/human"
          if [ -d docs/man ]; then
            cp docs/man/*.1 "${PKG}/usr/share/man/man1/" 2>/dev/null || true
          fi
          if [ -f completions/human.bash ]; then
            cp completions/human.bash "${PKG}/usr/share/bash-completion/completions/human"
          fi
          if [ -f completions/_human ]; then
            cp completions/_human "${PKG}/usr/share/zsh/vendor-completions/_human"
          fi
          cat > "${PKG}/DEBIAN/control" <<CTRL
          Package: human
          Version: ${VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Seth Ford <seth@h-uman.ai>
          Homepage: https://h-uman.ai
          Description: The smallest fully autonomous AI assistant infrastructure
           Zero-dependency C11 runtime for autonomous AI assistants.
           Sub-2 MB binary, <6 MB RAM, <30 ms startup.
          CTRL
          sed -i 's/^          //' "${PKG}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${PKG}"
          mv "${PKG}.deb" "human_${VER}_amd64.deb"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            human-linux-x86_64.bin
            human-linux-aarch64.bin
            human-macos-aarch64.bin
            human_*_amd64.deb
            human-extras.tar.gz
            sha256sums.txt
            install.sh
          generate_release_notes: true

  docker:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  update-tap:
    # US-9.1: After a release ships, mirror the formula into humanlabs/homebrew-human
    # with real SHA256s drawn from the just-published sha256sums.txt artifact.
    #
    # PRECONDITION: HUMANLABS_TAP_PUSH_TOKEN must exist in repo secrets, scoped
    # to the humanlabs/homebrew-human repo with contents:write only. If absent,
    # this job fails loudly — intentional per quality-gates.md "no silent failures".
    #
    # SECURITY: GITHUB_REF_NAME is the runner-provided env var (tag name). The
    # workflow trigger filter `tags: ["v*"]` constrains it to release tags, which
    # are write-restricted to maintainers. No untrusted user input flows into
    # any `run:` step.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout source repo (for formula + script)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Formula
            scripts

      - name: Download sha256sums from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$REPO" \
            --pattern "sha256sums.txt" \
            --output sha256sums.txt
          test -s sha256sums.txt

      - name: Clone tap repo
        env:
          TAP_TOKEN: ${{ secrets.HUMANLABS_TAP_PUSH_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HUMANLABS_TAP_PUSH_TOKEN is not set; cannot push tap update" >&2
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/humanlabs/homebrew-human.git" tap

      - name: Update formula hashes in tap clone
        run: |
          # The tap mirrors Formula/human.rb 1:1. Copy our (placeholder-shaped)
          # source-of-truth formula in, then rewrite hashes against sha256sums.
          mkdir -p tap/Formula
          cp Formula/human.rb tap/Formula/human.rb
          chmod +x scripts/update-formula-hashes.sh
          scripts/update-formula-hashes.sh \
            --version "$RELEASE_TAG" \
            --sums sha256sums.txt \
            --formula tap/Formula/human.rb

      - name: Commit and push tap update
        working-directory: tap
        run: |
          git config user.name "human-release-bot"
          git config user.email "bot@h-uman.ai"
          if git diff --quiet Formula/human.rb; then
            echo "tap formula already up-to-date for $RELEASE_TAG; nothing to push"
            exit 0
          fi
          git add Formula/human.rb
          git commit -m "release: bump human to $RELEASE_TAG"
          git push origin HEAD

  brew-install-smoke:
    # US-9.1: End-to-end smoke that proves `brew tap && brew install` works
    # against the just-updated tap. Release-only — slow on each PR (~6-9 min)
    # and depends on a published release existing. Pinned to macos-15 per
    # design doc to avoid macos-latest image drift.
    needs: update-tap
    runs-on: macos-15
    env:
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts

      - name: Run brew install smoke
        run: |
          chmod +x scripts/check-formula-install.sh
          scripts/check-formula-install.sh
