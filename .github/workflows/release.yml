name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-latest
            target: linux-aarch64
            cross: true
          - os: macos-latest
            target: macos-aarch64

    steps:
      - uses: actions/checkout@v6

      - name: Install aarch64 cross-compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libsqlite3-dev:arm64 libcurl4-openssl-dev:arm64
        continue-on-error: true

      - uses: ./.github/actions/setup-build
        with:
          build-type: MinSizeRel
          enable-lto: "true"
          enable-curl: ${{ !matrix.cross && 'true' || 'false' }}
          enable-all-channels: "true"
          enable-update: "true"
          target: human
          extra-cmake-flags: ${{ matrix.cross && '-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: human-${{ matrix.target }}
          path: build/human

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            completions
            docs/man
            install.sh
            LICENSE

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          ls -R artifacts/
          mv artifacts/human-linux-x86_64/human human-linux-x86_64.bin
          mv artifacts/human-linux-aarch64/human human-linux-aarch64.bin
          mv artifacts/human-macos-aarch64/human human-macos-aarch64.bin
          chmod +x human-linux-x86_64.bin human-linux-aarch64.bin human-macos-aarch64.bin

      - name: Generate SHA256 checksums
        run: sha256sum human-linux-x86_64.bin human-linux-aarch64.bin human-macos-aarch64.bin > sha256sums.txt

      - name: Package completions and man pages
        run: tar czf human-extras.tar.gz completions/ docs/man/ install.sh LICENSE

      - name: Build .deb package (x86_64)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG=human_${VER}_amd64
          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/bin"
          mkdir -p "${PKG}/usr/share/man/man1"
          mkdir -p "${PKG}/usr/share/bash-completion/completions"
          mkdir -p "${PKG}/usr/share/zsh/vendor-completions"
          cp human-linux-x86_64.bin "${PKG}/usr/bin/human"
          chmod 755 "${PKG}/usr/bin/human"
          if [ -d docs/man ]; then
            cp docs/man/*.1 "${PKG}/usr/share/man/man1/" 2>/dev/null || true
          fi
          if [ -f completions/human.bash ]; then
            cp completions/human.bash "${PKG}/usr/share/bash-completion/completions/human"
          fi
          if [ -f completions/_human ]; then
            cp completions/_human "${PKG}/usr/share/zsh/vendor-completions/_human"
          fi
          cat > "${PKG}/DEBIAN/control" <<CTRL
          Package: human
          Version: ${VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Seth Ford <seth@h-uman.ai>
          Homepage: https://h-uman.ai
          Description: The smallest fully autonomous AI assistant infrastructure
           Zero-dependency C11 runtime for autonomous AI assistants.
           Sub-2 MB binary, <6 MB RAM, <30 ms startup.
          CTRL
          sed -i 's/^          //' "${PKG}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${PKG}"
          mv "${PKG}.deb" "human_${VER}_amd64.deb"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            human-linux-x86_64.bin
            human-linux-aarch64.bin
            human-macos-aarch64.bin
            human_*_amd64.deb
            human-extras.tar.gz
            sha256sums.txt
            install.sh
          generate_release_notes: true

  docker:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # US-43.1: Homebrew tap auto-update.
  #
  # Concurrency-guarded so two release runs cannot race the tap repo.
  # `cancel-in-progress: false` queues the second run rather than killing it.
  #
  # All `${{ }}` expressions bind to `env:` first; `run:` blocks only
  # reference plain `$VAR`. This is the workflow-injection-safety contract
  # documented in sprints/sprint-43/designs/US-43.1.md.
  # ---------------------------------------------------------------------------
  update-tap:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: tap-update
      cancel-in-progress: false
    env:
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      TAG_NAME: ${{ github.ref_name }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GITHUB_ACTOR_NAME: ${{ github.actor }}
      REPO_FULL_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            Formula
            scripts

      - name: Skip if tap repo not configured
        id: gate
        env:
          GATE_TAP_REPO: ${{ env.TAP_REPO }}
        run: |
          if [ -z "${GATE_TAP_REPO:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_REPO not set; skipping tap update."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download sha256sums from release
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DL_TAG: ${{ env.TAG_NAME }}
          DL_REPO: ${{ env.REPO_FULL_NAME }}
        run: |
          gh release download "$DL_TAG" \
            --repo "$DL_REPO" \
            --pattern 'sha256sums.txt' \
            --dir .

      - name: Compute version from tag
        if: steps.gate.outputs.configured == 'true'
        id: ver
        env:
          IN_TAG: ${{ env.TAG_NAME }}
        run: |
          VERSION="${IN_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update formula in source tree
        if: steps.gate.outputs.configured == 'true'
        env:
          IN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x scripts/update-formula-hashes.sh
          scripts/update-formula-hashes.sh \
            --formula Formula/human.rb \
            --version "$IN_VERSION" \
            --sha256sums sha256sums.txt

      - name: Clone tap and apply update
        if: steps.gate.outputs.configured == 'true'
        env:
          PUSH_TAP_REPO: ${{ env.TAP_REPO }}
          PUSH_TAP_TOKEN: ${{ env.TAP_TOKEN }}
          PUSH_TAG: ${{ env.TAG_NAME }}
          PUSH_VERSION: ${{ steps.ver.outputs.version }}
          PUSH_ACTOR: ${{ env.GITHUB_ACTOR_NAME }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${PUSH_TAP_TOKEN}@github.com/${PUSH_TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp Formula/human.rb tap/Formula/human.rb
          cd tap
          git config user.name "h-uman release bot"
          git config user.email "release-bot@h-uman.ai"
          if git diff --quiet -- Formula/human.rb; then
            echo "tap formula already at $PUSH_VERSION; nothing to commit"
            exit 0
          fi
          git add Formula/human.rb
          git commit -m "human ${PUSH_VERSION} (tag ${PUSH_TAG}, pushed by ${PUSH_ACTOR})"
          git push origin HEAD

  # ---------------------------------------------------------------------------
  # US-43.1: Homebrew install smoke test.
  # Pinned to macos-15 so a `macos-latest` flip cannot silently change the env.
  # ---------------------------------------------------------------------------
  brew-install-smoke:
    needs: update-tap
    runs-on: macos-15
    env:
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts

      - name: Skip if tap repo not configured
        id: gate
        env:
          GATE_TAP_REPO: ${{ env.TAP_REPO }}
        run: |
          if [ -z "${GATE_TAP_REPO:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_REPO not set; skipping smoke."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: brew install --build-from-source smoke
        if: steps.gate.outputs.configured == 'true'
        env:
          IN_TAP_REPO: ${{ env.TAP_REPO }}
          IN_TAG: ${{ env.TAG_NAME }}
        run: |
          chmod +x scripts/check-formula-install.sh
          scripts/check-formula-install.sh \
            --tap "$IN_TAP_REPO" \
            --tag "$IN_TAG"
