version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-deps:
        patterns: ["*"]
    ignore:
      # @astrojs/check 0.9.x declares peer typescript "^5.0.0 || ^6.0.0"; the
      # 2026-09 group bump to typescript 7.0.2 made `npm ci` fail on the peer
      # conflict (#366). Let dependabot bump minors/patches; take TS majors by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /design-tokens
    schedule:
      interval: weekly
    groups:
      design-tokens-deps:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /apps/shared/HumanKit
    schedule:
      interval: weekly
    groups:
      humankit-deps:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /apps/ios
    schedule:
      interval: weekly
    groups:
      ios-deps:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /apps/macos
    schedule:
      interval: weekly
    groups:
      macos-deps:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    groups:
      android-deps:
        patterns: ["*"]
