[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-hula-sdk"
version = "0.1.0"
description = "Python SDK for HuLa (Human Language) programs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Seth Ford", email = "seth.ford@gmail.com"}
]
keywords = ["human", "hula", "ai", "agent", "language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.7"
dependencies = []

[project.urls]
Homepage = "https://github.com/sethdford/h-uman"
Repository = "https://github.com/sethdford/h-uman"
Issues = "https://github.com/sethdford/h-uman/issues"

[tool.setuptools]
packages = ["human"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
